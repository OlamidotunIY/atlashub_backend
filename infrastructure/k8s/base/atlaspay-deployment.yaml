apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlaspay-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlaspay-app
  template:
    metadata:
      labels:
        app: atlaspay-app
    spec:
      containers:
      - name: atlaspay-app
        image: atlaspay/app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_REDIS_HOST
          value: "redis"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: atlaspay-app
spec:
  ports:
  - port: 8080
  selector:
    app: atlaspay-app
