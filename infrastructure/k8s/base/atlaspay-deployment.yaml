apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlashub-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlashub-app
  template:
    metadata:
      labels:
        app: atlashub-app
    spec:
      containers:
      - name: atlashub-app
        image: atlashub/app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: atlashub-secrets
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/atlashub?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "atlashub"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "atlashub"
        volumeMounts:
        - name: firebase-secrets
          mountPath: /app/infrastructure/Firebase
          readOnly: true
      volumes:
      - name: firebase-secrets
        secret:
          secretName: firebase-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: atlashub-app
spec:
  ports:
  - port: 8080
  selector:
    app: atlashub-app
