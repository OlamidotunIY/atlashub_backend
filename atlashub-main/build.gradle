plugins {
    id 'java'
}

group = 'com.atlashub'
version = '2.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // 1. Internal Modular Monolith Projects
    implementation project(':atlashub-shared')

    // Platform Modules
    implementation project(':atlashub-platform:authentication')
    implementation project(':atlashub-platform:accounts')
    implementation project(':atlashub-platform:catalog')
    implementation project(':atlashub-platform:iam')
    implementation project(':atlashub-platform:storage')

    // Infrastructure Modules
    implementation project(':atlashub-infrastructure:eventbus')
    implementation project(':atlashub-infrastructure:rate-limiter')
    implementation project(':atlashub-infrastructure:audit')

    // 2. Spring Boot Core Web & Security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 3. Database & Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 4. JWT Library
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // 5. MySQL Driver
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 6. Swagger / SpringDoc OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    // 7. Firebase Admin SDK (for FirebaseApp bean in ApplicationConfig)
    implementation 'com.google.firebase:firebase-admin:9.3.0'
}

test {
    useJUnitPlatform()
}